name: TallyHo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tallyho-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test web logic and build iOS Simulator app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run JavaScript tests
        run: npm test

      - name: Verify bundled web assets
        run: |
          cmp www/app.js ios/App/App/public/app.js
          cmp www/index.html ios/App/App/public/index.html
          cmp www/sw.js ios/App/App/public/sw.js

      - name: Build native app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme TallyHo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
